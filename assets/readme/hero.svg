<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" role="img" aria-label="OmegaTrade Ultra - animated hero: live candlesticks drawing themselves, a scrolling market ticker, and a pulsing 7-model ensemble">
  <style><![CDATA[
    /* ── OmegaTrade Ultra hero motion system ─────────────────────────── */
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.45; transform: scale(1.35); }
    }
    @keyframes candleIn {
      0%   { opacity: 0; transform: translateY(14px) scaleY(0.2); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scaleY(1); }
    }
    @keyframes lastCandleTick {
      0%, 100% { fill: #0a9c36; }
      50%      { fill: #d43b36; }
    }
    @keyframes drawLine {
      0%        { stroke-dashoffset: 560; }
      55%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes coneBreath {
      0%, 100% { opacity: 0.14; }
      50%      { opacity: 0.32; }
    }
    @keyframes forecastDash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes scanSweep {
      0%       { transform: translateX(0); opacity: 0; }
      8%       { opacity: 0.55; }
      92%      { opacity: 0.55; }
      100%     { transform: translateX(560px); opacity: 0; }
    }
    @keyframes tapeScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-1400px); }
    }
    @keyframes nodePulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.22); }
    }
    @keyframes synapseFlow {
      to { stroke-dashoffset: -28; }
    }
    @keyframes cursorBlink {
      0%, 49%  { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes underlineDraw {
      0%   { stroke-dashoffset: 300; }
      45%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes priceFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    @keyframes chipGlow {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 1; }
    }
    .live-dot   { animation: livePulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .candle     { animation: candleIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; transform-origin: center bottom; transform-box: fill-box; }
    .last-wick  { animation: lastCandleTick 2.2s steps(1) infinite; }
    .price-line { stroke-dasharray: 560; animation: drawLine 3.2s cubic-bezier(0.6, 0, 0.3, 1) 0.6s infinite; }
    .cone       { animation: coneBreath 3.4s ease-in-out infinite; }
    .fc-path    { stroke-dasharray: 8 6; animation: forecastDash 1.4s linear infinite; }
    .scanline   { animation: scanSweep 5.5s linear infinite; }
    .tape       { animation: tapeScroll 32s linear infinite; }
    .node       { animation: nodePulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .synapse    { stroke-dasharray: 5 9; animation: synapseFlow 1.1s linear infinite; }
    .cursor     { animation: cursorBlink 1.1s steps(1) infinite; }
    .headline-rule { stroke-dasharray: 300; animation: underlineDraw 4.5s cubic-bezier(0.6,0,0.3,1) infinite; }
    .price-pill { animation: priceFloat 3s ease-in-out infinite; }
    .chip-dot   { animation: chipGlow 2.4s ease-in-out infinite; }
    .d1 { animation-delay: 0.10s; } .d2 { animation-delay: 0.22s; }
    .d3 { animation-delay: 0.34s; } .d4 { animation-delay: 0.46s; }
    .d5 { animation-delay: 0.58s; } .d6 { animation-delay: 0.70s; }
    .d7 { animation-delay: 0.82s; } .d8 { animation-delay: 0.94s; }
    .d9 { animation-delay: 1.06s; } .d10 { animation-delay: 1.18s; }
    .d11 { animation-delay: 1.30s; } .d12 { animation-delay: 1.42s; }
    .d13 { animation-delay: 1.54s; } .d14 { animation-delay: 1.66s; }
    .n1 { animation-delay: 0s; }  .n2 { animation-delay: .28s; }
    .n3 { animation-delay: .56s; } .n4 { animation-delay: .84s; }
    .n5 { animation-delay: 1.12s; } .n6 { animation-delay: 1.4s; }
    .n7 { animation-delay: 1.68s; }
  ]]></style>

  <defs>
    <linearGradient id="hOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bee4b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2bee4b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bee4b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2bee4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f7f0"/>
    </linearGradient>
    <linearGradient id="hScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bee4b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2bee4b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2bee4b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hTape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121613"/>
      <stop offset="1" stop-color="#0a0d0b"/>
    </linearGradient>
    <filter id="hBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
  </defs>

  <!-- ══════════ canvas ══════════ -->
  <rect width="1400" height="640" fill="#fafffa"/>
  <ellipse cx="1150" cy="90" rx="420" ry="240" fill="url(#hGlow)" filter="url(#hBlur)"/>
  <ellipse cx="180" cy="560" rx="340" ry="200" fill="url(#hGlow)" filter="url(#hBlur)" opacity="0.55"/>
  <g stroke="#e3ebe1" stroke-width="1" opacity="0.65">
    <path d="M0 128 H1400 M0 256 H1400 M0 384 H1400 M0 512 H1400"/>
    <path d="M233 0 V640 M466 0 V640 M700 0 V640 M933 0 V640 M1166 0 V640"/>
  </g>

  <!-- ══════════ masthead ══════════ -->
  <g>
    <rect x="56" y="34" width="1288" height="2" fill="#121613"/>
    <text x="56" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#121613" letter-spacing="0.5">Ω ULTRA<tspan fill="#16a034">.</tspan></text>
    <g class="live-dot">
      <circle cx="268" cy="68" r="7" fill="#2bee4b"/>
    </g>
    <circle cx="268" cy="68" r="7" fill="none" stroke="#16a034" stroke-opacity="0.5">
      <animate attributeName="r" values="7;16" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="286" y="73" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16a034" letter-spacing="3">LIVE · 24/7</text>
    <text x="1344" y="66" text-anchor="end" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#516254" letter-spacing="2.5">STOCKS · FOREX · CRYPTO · INDICES · FUTURES</text>
    <text x="1344" y="86" text-anchor="end" font-family="monospace" font-size="11.5" fill="#7b8a7d" letter-spacing="1.5">30+ FREE PROVIDERS · ZERO MOCK DATA · OPEN SOURCE</text>
    <rect x="56" y="96" width="1288" height="1.5" fill="#c8d2c8"/>
  </g>

  <!-- ══════════ headline ══════════ -->
  <g>
    <text x="56" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#121613" letter-spacing="-1.5">Real-time markets,</text>
    <text x="56" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="400" font-style="italic" fill="#2a312b" letter-spacing="-1.5">forecast by a machine</text>
    <text x="56" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="400" font-style="italic" fill="#2a312b" letter-spacing="-1.5">that learns from its own misses.<tspan class="cursor" dx="6" font-size="56" fill="#2bee4b">▌</tspan></text>
    <path class="headline-rule" d="M58 372 H420" stroke="#2bee4b" stroke-width="5" fill="none" stroke-linecap="round"/>

    <text x="56" y="412" font-family="system-ui, sans-serif" font-size="16.5" fill="#516254">A zero-cost trading terminal that streams real prices for five markets, runs a</text>
    <text x="56" y="436" font-family="system-ui, sans-serif" font-size="16.5" fill="#516254">self-improving 7-model AI ensemble in your browser, verifies every forecast —</text>
    <text x="56" y="460" font-family="system-ui, sans-serif" font-size="16.5" fill="#516254">and shows its own accuracy ledger next to the live data.</text>
  </g>

