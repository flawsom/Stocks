      <g class="candle d2"><rect x="830" y="282" width="16" height="60" rx="2" fill="#0a9c36"/><line x1="838" y1="270" x2="838" y2="356" stroke="#0a9c36" stroke-width="2"/></g>
      <g class="candle d3"><rect x="864" y="292" width="16" height="44" rx="2" fill="#d43b36"/><line x1="872" y1="280" x2="872" y2="350" stroke="#d43b36" stroke-width="2"/></g>
      <g class="candle d4"><rect x="898" y="266" width="16" height="58" rx="2" fill="#0a9c36"/><line x1="906" y1="254" x2="906" y2="338" stroke="#0a9c36" stroke-width="2"/></g>
      <g class="candle d5"><rect x="932" y="248" width="16" height="48" rx="2" fill="#0a9c36"/><line x1="940" y1="236" x2="940" y2="310" stroke="#0a9c36" stroke-width="2"/></g>
      <g class="candle d6"><rect x="966" y="258" width="16" height="38" rx="2" fill="#d43b36"/><line x1="974" y1="246" x2="974" y2="308" stroke="#d43b36" stroke-width="2"/></g>
