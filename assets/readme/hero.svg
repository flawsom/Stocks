          <text x="560" y="629" fill="#fafffa">^GSPC <tspan fill="#2bee4b">▲ 5,614.20</tspan></text>
          <text x="740" y="629" fill="#fafffa">ES=F <tspan fill="#2bee4b">▲ 5,672.25</tspan></text>
          <text x="920" y="629" fill="#fafffa">XAU/USD <tspan fill="#2bee4b">▲ 2,504.10</tspan></text>
