      <rect width="180" height="30" rx="15" fill="#2bee4b" fill-opacity="0.14" stroke="#2bee4b" stroke-opacity="0.4"/>
      <text x="16" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#2bee4b">▲ AI SIGNAL · 84%</text>
