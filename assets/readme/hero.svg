<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-label="OmegaTrade Ultra — real-time multi-market intelligence terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b100d"/>
      <stop offset="0.55" stop-color="#121a14"/>
      <stop offset="1" stop-color="#0a0e0c"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bee4b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2bee4b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bee4b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2bee4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <circle cx="1090" cy="120" r="330" fill="url(#orb)" filter="url(#blur)"/>
  <circle cx="220" cy="480" r="260" fill="url(#orb)" filter="url(#blur)" opacity="0.5"/>

  <!-- hairline grid -->
  <g stroke="#1d2a20" stroke-width="1" opacity="0.6">
    <path d="M0 112 H1400 M0 224 H1400 M0 336 H1400 M0 448 H1400"/>
    <path d="M280 0 V560 M560 0 V560 M840 0 V560 M1120 0 V560"/>
  </g>

  <!-- top bar -->
  <g>
    <rect x="56" y="40" width="1288" height="64" rx="16" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="88" y="82" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#fafffa" letter-spacing="0.5">Ω ULTRA<span fill="#2bee4b">.</span></text>
    <rect x="240" y="66" width="12" height="12" rx="6" fill="#2bee4b"/>
    <text x="264" y="77" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#9fe8ac" letter-spacing="2">LIVE · 5 MARKETS</text>
    <g text-anchor="end">
      <text x="1268" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#7d8f80">NY 09:30 · LDN 14:30 · TYO 22:30</text>
      <text x="1268" y="92" font-family="monospace" font-size="12" fill="#4f6152">TICK 0.4s</text>
    </g>
  </g>

  <!-- headline -->
  <g>
    <text x="56" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="#fafffa" letter-spacing="-1.5">Real-time markets,</text>
    <text x="56" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="400" font-style="italic" fill="#d8e6d9" letter-spacing="-1.5">forecast by a machine</text>
    <text x="56" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#7d8f80">that learns from its own misses.</text>
    <g font-family="system-ui, sans-serif">
      <rect x="56" y="392" width="200" height="48" rx="8" fill="#2bee4b"/>
      <text x="156" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#061308" letter-spacing="1.5">LAUNCH TERMINAL</text>
      <rect x="272" y="392" width="200" height="48" rx="8" fill="none" stroke="#fafffa" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="372" y="423" text-anchor="middle" font-size="16" font-weight="600" fill="#fafffa" letter-spacing="1.5">READ THE BRIEF</text>
    </g>
