      <rect x="336" y="172" width="9"  height="78"  fill="#0a9c36"/>
      <rect x="336" y="166" width="2"  height="90"  fill="#0a9c36"/>
      <rect x="366" y="140" width="9"  height="40"  fill="#d43b36"/>
      <rect x="366" y="134" width="2"  height="52"  fill="#d43b36"/>
      <rect x="396" y="160" width="9"  height="76"  fill="#0a9c36"/>
      <rect x="396" y="154" width="2"  height="88"  fill="#0a9c36"/>
      <rect x="426" y="128" width="9"  height="36"  fill="#d43b36"/>
