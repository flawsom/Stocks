<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" role="img" aria-label="Animated product screens: the desktop terminal with live chart and prediction log, mobile watchlist, analytics ledger, and the full-market scanner">
  <style><![CDATA[
    /* ── Screens motion system ──────────────────────────────────────── */
    @keyframes scrPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(1.4); }
    }
    @keyframes scrCandle {
      0%   { opacity: 0; transform: scaleY(0.15); }
      100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes scrTick {
      0%, 100% { fill: #0a9c36; }
      50%      { fill: #d43b36; }
    }
    @keyframes accBar {
      0%        { width: 0; }
      40%, 100% { width: var(--w); }
    }
    @keyframes eqDraw {
      0%        { stroke-dashoffset: 320; }
      55%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes rowScan {
      0%       { transform: translateY(0); opacity: 0; }
      10%, 45% { opacity: 1; }
      55%, 100%{ transform: translateY(18px); opacity: 0; }
    }
    @keyframes tabSweep {
      0%, 20%   { transform: translateX(0); }
      30%, 70%  { transform: translateX(92px); }
      80%, 100% { transform: translateX(184px); }
    }
    @keyframes journalType {
      0%, 10%  { opacity: 0; }
      16%, 74% { opacity: 1; }
      84%,100% { opacity: 0; }
    }
    @keyframes journalType2 {
      0%, 30%  { opacity: 0; }
      38%, 84% { opacity: 1; }
      94%,100% { opacity: 0; }
    }
    @keyframes priceBlip {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    .sDot    { animation: scrPulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .sCandle { animation: scrCandle 0.45s cubic-bezier(0.2,0.9,0.3,1.2) both; transform-origin: center bottom; transform-box: fill-box; }
    .sTick   { animation: scrTick 2.4s steps(1) infinite; }
    .acc     { animation: accBar 2.8s cubic-bezier(0.6,0,0.3,1) infinite; }
    .eq      { stroke-dasharray: 320; animation: eqDraw 3.4s cubic-bezier(0.6,0,0.3,1) infinite; }
    .scanRow { animation: rowScan 3.2s linear infinite; }
    .tabs    { animation: tabSweep 6s ease-in-out infinite; }
    .jA      { animation: journalType 5.6s linear infinite; }
    .jB      { animation: journalType2 5.6s linear infinite; }
    .blip    { animation: priceBlip 1.8s ease-in-out infinite; }
    .c1 { animation-delay: .08s; } .c2 { animation-delay: .16s; } .c3 { animation-delay: .24s; }
    .c4 { animation-delay: .32s; } .c5 { animation-delay: .40s; } .c6 { animation-delay: .48s; }
    .c7 { animation-delay: .56s; } .c8 { animation-delay: .64s; } .c9 { animation-delay: .72s; }
    .c10 { animation-delay: .80s; } .c11 { animation-delay: .88s; } .c12 { animation-delay: .96s; }
  ]]></style>

  <defs>
    <linearGradient id="sPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f7f0"/>
    </linearGradient>
    <filter id="sBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <radialGradient id="sGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bee4b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2bee4b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="920" fill="#fafffa"/>
  <ellipse cx="700" cy="460" rx="620" ry="380" fill="url(#sGlow)" filter="url(#sBlur)"/>
  <g stroke="#e3ebe1" stroke-width="1" opacity="0.55">
    <path d="M0 230 H1400 M0 460 H1400 M0 690 H1400"/>
    <path d="M350 0 V920 M700 0 V920 M1050 0 V920"/>
  </g>

  <text x="700" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#121613">One terminal. Five markets. Every number alive.</text>
  <rect x="560" y="74" width="280" height="4" rx="2" fill="#2bee4b"/>

