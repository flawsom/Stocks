      <text x="136" y="184" text-anchor="middle" fill="#121613" font-weight="700" opacity="0">.</text>
      <text x="220" y="184" text-anchor="middle">FOREX</text>
      <text x="312" y="184" text-anchor="middle">CRYPTO</text>
      <text x="404" y="184" text-anchor="middle">INDICES</text>
