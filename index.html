<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console ownership verification (HTML tag method) -->
    <meta name="google-site-verification" content="RgI7nUWM5MHB3uU-nFoW-tLXDUp-n45oYYyX-nRVYTo" />

    <!-- Primary meta. Per-route title/description/canonical/OG are rendered
         client-side by react-helmet-async so each page owns its own head tags;
         this shell carries the site-wide title, JSON-LD and asset hints. -->
    <title>OmegaTrade Ultra — Free Live Stock Prices & AI Forecasts</title>
    <meta name="keywords" content="stock prices, live stock prices, trading terminal, real-time market data, AI predictions, technical analysis, stocks, forex, crypto, indices, futures, candlestick charts, paper trading, free trading terminal, open source trading" />
    <meta name="author" content="OmegaTrade Ultra" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#121613" />
    <meta name="application-name" content="OmegaTrade Ultra" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- Structured data (JSON-LD) — WebApplication + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "OmegaTrade Ultra",
      "url": "https://stock.unifies.codes/",
      "image": "https://stock.unifies.codes/og-image.png",
      "description": "Free real-time multi-market trading terminal for Stocks, Forex, Crypto, Indices and Futures with an in-browser, self-improving 7-model AI forecast ensemble, technical analysis, live news sentiment and paper trading. Zero mock data — every number comes from a live provider feed.",
      "applicationCategory": "FinanceApplication",
      "applicationSubCategory": "TradingTerminal",
      "operatingSystem": "Web",
      "browserRequirements": "Requires a modern browser with WebSocket support",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      },
      "featureList": [
        "Live real-time prices across 5 markets",
        "20+ free data providers with automatic failover",
        "Self-improving 7-model AI forecast ensemble",
        "Full technical analysis suite",
        "Paper trading engine",
        "Live news and sentiment",
        "Zero mock data"
      ],
      "keywords": "stock prices, live stock prices, trading terminal, real-time market data, AI predictions, technical analysis, stocks, forex, crypto, indices, futures",
      "inLanguage": "en",
      "datePublished": "2026-08-14",
      "publisher": {
        "@type": "Organization",
        "name": "OmegaTrade Ultra",
        "url": "https://github.com/flawsom/Stocks"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OmegaTrade Ultra",
      "url": "https://stock.unifies.codes/",
      "description": "Free real-time multi-market intelligence terminal with autonomous AI forecasting.",
      "inLanguage": "en"
    }
    </script>

    <!-- Structured data (JSON-LD) — Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OmegaTrade Ultra",
      "url": "https://stock.unifies.codes/",
      "logo": "https://stock.unifies.codes/og-image.png",
      "sameAs": [
        "https://github.com/flawsom/Stocks"
      ]
    }
    </script>

    <!-- Structured data (JSON-LD) — FAQPage, mirrors the landing /#faq section -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is OmegaTrade Ultra really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — the entire terminal runs in your browser. There is no account, no subscription, no server bill, and nothing to install. All market data comes from free public providers, and the AI forecasting runs client-side."
          }
        },
        {
          "@type": "Question",
          "name": "Where does the live market data come from?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A mesh of 20+ free sources: Finnhub and Polygon for US equities, Kraken, Coinbase, OKX and a dozen more crypto venues, Yahoo Finance relays for real index levels and futures contracts, and er-api/ECB for forex. Every quote races multiple sources and the fastest valid price wins, with automatic failover when one is rate-limited."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI forecast work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A 7-model ensemble that runs entirely in your browser — including a lightweight neural network with Monte-Carlo uncertainty estimation, continual-learning updates and Grad-CAM explainability. It keeps an accuracy ledger of its own past predictions and retrains on its own misses, and a circuit breaker withholds signals when uncertainty is too high."
          }
        },
        {
          "@type": "Question",
          "name": "Which markets are covered?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stocks (US equities), Forex (major pairs), Crypto (20+ venues), Indices (S&P 500, Nasdaq Composite, Dow, Russell 2000 and the VIX — real index levels, not ETF proxies) and Futures (ES, CL, NG, SI via real contracts)."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need an API key to use it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. It works keyless out of the box. You can optionally add your own free keys for TwelveData, Finnhub, Polygon or Alpha Vantage to raise your personal rate limits — they are all optional overrides."
          }
        },
        {
          "@type": "Question",
          "name": "Is this financial advice? Can I trade real money?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No and no. OmegaTrade Ultra is a research and education tool with a paper-trading engine — signals are forecasts, not recommendations, and no real orders are ever placed. Markets carry risk; do your own research."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data safe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nothing leaves your browser except market-data requests to public APIs. There is no account, no tracking server, and no stored personal information."
          }
        }
      ]
    }
    </script>

    <!-- Performance: font + provider connection hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
    <link rel="dns-prefetch" href="https://finnhub.io" />
    <link rel="dns-prefetch" href="https://data-api.binance.vision" />
    <link rel="dns-prefetch" href="https://api.kraken.com" />
    <link rel="dns-prefetch" href="https://api.coingecko.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
